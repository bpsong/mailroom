[project]
name = "mailroom-tracking"
version = "1.0.0"
description = "Internal mailroom package tracking system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.122.0,<1.0.0",
    "starlette>=0.49.1,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-magic>=0.4.27,<1.0.0",
    "qrcode[pil]>=7.4.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pip-audit>=2.7.0,<3.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "DTZ", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures intentionally use naive datetimes and broad catches;
# production code is held to the stricter default above.
"tests/**" = ["BLE001", "DTZ001", "DTZ003", "DTZ005", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
# Start lenient; tighten after the service splits land.
disallow_untyped_defs = false
warn_return_any = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/__init__.py"]

[tool.coverage.report]
# Baseline lock measured 2026-09-18 on the full suite (67%). Raise it as
# untested areas (write_queue internals, main lifespan, decorators) gain tests.
fail_under = 67
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "except ImportError",
    "except OSError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage runs on every invocation so fail_under is always enforced.
# Use --no-cov for fast subset runs (e.g. pytest tests/unit -q --no-cov).
addopts = ["--cov=app", "--cov-report=term-missing"]
filterwarnings = [
    # Fail on any future datetime.utcnow() use; third-party deprecations stay warnings.
    "error:datetime.datetime.utcnow.*:DeprecationWarning",
]
